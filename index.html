<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 우편 — 발송·반송</title>
<meta name="theme-color" content="#003A84">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/post.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div class="mark" aria-hidden="true">A1</div>
        <b>A1KOREA</b>
        <span class="sub">우편 발송·반송</span>
      </div>
      <div class="top-right">
        <span id="modeBadge" class="pill-mode">데모</span>
        <span id="todayLabel" class="today"></span>
        <button class="icon-btn" id="btnHelp" aria-label="도움말" title="도움말">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8"/><path d="M12 17h.01"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="alerts" class="alerts" aria-live="polite"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="우편 업무"></nav>
  <main>
    <section id="view" class="view" role="tabpanel" tabindex="-1"></section>
  </main>
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="우편 업무"></nav>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-bg" data-act="close-panel"></div>
    <div class="panel-in" role="dialog" aria-modal="true" aria-label="상세">
      <div class="panel-h" id="panelH"></div>
      <div class="panel-b" id="panelB"></div>
      <div class="panel-f" id="panelF"></div>
    </div>
  </aside>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-bg" data-act="close-modal"></div>
    <div class="modal-in" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-h"><h2 id="modalTitle">제목</h2><button class="icon-btn" style="margin-left:auto" data-act="close-modal" aria-label="닫기">✕</button></div>
      <form id="modalForm" novalidate><div class="modal-b" id="modalB"></div><div class="modal-f" id="modalF"></div></form>
    </div>
  </div>

  <div id="toast" aria-live="polite"></div>
</div>

<div class="print-root" id="printRoot"></div>

<script src="assets/config.js"></script>
<script src="assets/demo-seed.js"></script>
<script src="assets/store.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
